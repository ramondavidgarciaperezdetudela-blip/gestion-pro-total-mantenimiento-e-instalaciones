# ================================================================
# GESTION PRO TOTAL - Configuracion Nginx
# Guarda este fichero como:
#   Linux/Mac: /etc/nginx/sites-available/gestion-pro-total
#   Luego: sudo ln -s /etc/nginx/sites-available/gestion-pro-total /etc/nginx/sites-enabled/
#   Windows: C:\nginx\conf\sites\gestion-pro-total.conf
# ================================================================

# Redirigir HTTP a HTTPS (si tienes certificado SSL)
server {
    listen 80;
    server_name _;   # Cambia _ por tu IP o dominio, ej: 192.168.1.100 o mi-empresa.local

    # Si no tienes SSL, comenta el bloque de arriba y descomenta esto:
    # location / {
    #     root /var/www/gestion-pro-total;
    #     try_files $uri $uri/ /index.html;
    #     index index.html;
    # }

    # Con SSL: redirigir a HTTPS
    return 301 https://$host$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl http2;
    server_name _;   # Cambia por tu IP/dominio

    # ── Certificados SSL ──────────────────────────────────────────
    # Genera uno autofirmado con:
    # sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048
    #   -keyout /etc/nginx/ssl/gestion-pro-total.key
    #   -out    /etc/nginx/ssl/gestion-pro-total.crt
    ssl_certificate     /etc/nginx/ssl/gestion-pro-total.crt;
    ssl_certificate_key /etc/nginx/ssl/gestion-pro-total.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Raiz de la aplicacion ─────────────────────────────────────
    root /var/www/gestion-pro-total;
    index index.html;

    # ── Compresion gzip ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/opentype;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Cache de assets estaticos ─────────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── SPA: todas las rutas van a index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    # ── Proxy API a Base44 (evita CORS en red local) ──────────────
    location /api/ {
        proxy_pass https://gestion-pro-total-mantenimiento-e-instalaciones-6994f997.base44.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host gestion-pro-total-mantenimiento-e-instalaciones-6994f997.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;

        # CORS para dispositivos de la red local
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
    }

    # ── Health check ──────────────────────────────────────────────
    location /health {
        return 200 '{"status":"ok","app":"Gestion Pro Total"}';
        add_header Content-Type application/json;
    }

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/gestion-pro-total-access.log;
    error_log  /var/log/nginx/gestion-pro-total-error.log;

    # ── Limite de subida (para importar tarifas grandes) ──────────
    client_max_body_size 50M;
}


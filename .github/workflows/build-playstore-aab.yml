name: Build Android AAB (Google Play)

# Compila un Android App Bundle (.aab) FIRMADO con la clave de release real,
# listo para subir a Google Play Console. Distinto del workflow
# build-apk.yml, que genera un APK de tipo debug para descarga directa
# (Play Store rechaza builds firmados en modo debug).
#
# Requiere estos secrets en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64  — el .keystore de release codificado en base64
#   ANDROID_KEYSTORE_PASSWORD — contraseña del keystore (y de la clave, es la misma)
#   ANDROID_KEY_ALIAS         — alias de la clave dentro del keystore
#
# Ver docs/BUILD-MULTIPLATAFORMA.md sección 2.C para más contexto.

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que existen los secrets de firma
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::Faltan secrets de firma (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS). Ver docs/BUILD-MULTIPLATAFORMA.md."
            exit 1
          fi
          echo "Secrets de firma presentes. Continuando."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decodificar keystore de release
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configurar firma release y versión en build.gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Versión: $VERSION_NAME (versionCode $VERSION_CODE)"

          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

          # Inserta signingConfigs { release { ... } } justo tras "android {"
          sed -i "s/^android {/android {\\n    signingConfigs {\\n        release {\\n            storeFile file('release.keystore')\\n            storePassword System.getenv('KEYSTORE_PASSWORD')\\n            keyAlias System.getenv('KEY_ALIAS')\\n            keyPassword System.getenv('KEYSTORE_PASSWORD')\\n        }\\n    }/" android/app/build.gradle

          # Referencia la signingConfig dentro de buildTypes.release
          sed -i "s/minifyEnabled false/signingConfig signingConfigs.release\n            minifyEnabled false/" android/app/build.gradle

          cat android/app/build.gradle

      - name: Compilar AAB firmado (Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: cd android && chmod +x ./gradlew && ./gradlew bundleRelease --no-daemon

      - name: Compilar APK firmado (prueba manual antes de publicar)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Subir AAB y APK firmados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: gestion-pro-total-playstore
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Build Android APK

# Genera el APK de la aplicación como artefacto descargable.
# Se ejecuta manualmente (workflow_dispatch) o al publicar una etiqueta vX.Y.Z.
# Con una etiqueta de versión publica una Release oficial con ese número; en
# ejecuciones manuales mantiene la release rodante "apk-latest".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # Los valores de conexión a Base44 se leen de .env.production (incluido en
        # el repositorio), por lo que no hace falta configurar secrets.
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gestion-pro-total.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-pro-total-debug-apk
          path: gestion-pro-total.apk
          if-no-files-found: error

      - name: Publish APK to a Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Gestión Pro Total {0}', github.ref_name) || 'Gestión Pro Total — APK (última compilación)' }}
          body: |
            APK de Gestión Pro Total.
            Descarga directa del archivo `gestion-pro-total.apk` más abajo.
          files: gestion-pro-total.apk
          make_latest: true

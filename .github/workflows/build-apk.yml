name: Build Android APK

# Genera el APK de la aplicación y lo publica como Release para descarga directa.
# - Disparo manual sin "version": actualiza la release rodante "apk-latest".
# - Disparo manual con "version" (ej: v1.0.0) o al empujar una etiqueta vX.Y.Z:
#   publica una Release oficial con ese número (creando la etiqueta si no existe).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de versión a publicar (ej: v1.0.0). Vacío = release rodante apk-latest."
        required: false
        default: ""
  push:
    tags:
      - 'v*'
    branches:
      - main
    # Compila el APK automáticamente en CADA cambio de código de la app.
    # (ignora cambios que no afectan al APK para no gastar minutos de más)
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'android-signing/**'
      - '.github/workflows/build-apk.yml'

# Si llegan varios cambios seguidos, cancela la compilación anterior y deja solo
# la última (evita amontonar builds cuando se editan varias cosas seguidas).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # Los valores de conexión a Base44 se leen de .env.production (incluido en
        # el repositorio), por lo que no hace falta configurar secrets.
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Firma estable (clave fija → actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gestion-pro-total.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-pro-total-debug-apk
          path: gestion-pro-total.apk
          if-no-files-found: error

      - name: Publish APK to a Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest') }}
          name: ${{ (inputs.version != '' || startsWith(github.ref, 'refs/tags/')) && format('Gestión Pro Total {0}', inputs.version != '' && inputs.version || github.ref_name) || 'Gestión Pro Total — APK (última compilación)' }}
          body: |
            APK de Gestión Pro Total.
            Descarga directa del archivo `gestion-pro-total.apk` más abajo.
          files: gestion-pro-total.apk
          make_latest: true

appId: com.gestionprototal.desktop
productName: Gestión Pro Total
copyright: © Ramón David García Pérez de Tudela

# Inyecta el punto de entrada de Electron en el paquete final.
extraMetadata:
  main: electron/main.cjs

directories:
  output: release
  buildResources: build

# Icono de la aplicación (build/icon.png 1024px y build/icon.ico para Windows).
# electron-builder genera automáticamente los tamaños/formatos por sistema.
icon: build/icon.png

# Publicación de releases en GitHub (habilita la auto-actualización con electron-updater).
publish:
  provider: github
  owner: ramondavidgarciaperezdetudela-blip
  repo: gestion-pro-total-mantenimiento-e-instalaciones

files:
  - dist/**/*
  - electron/**/*
  - package.json

# ---------- Windows ----------
win:
  target:
    - nsis        # Instalador con desinstalador integrado (.exe)
    - portable    # Versión portable sin instalación (un solo .exe: doble clic y a usar)

# Instalador clásico (Siguiente -> Siguiente -> Instalar)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gestión Pro Total
  artifactName: ${productName}-${version}-Windows-Instalador.${ext}
  # NSIS genera automáticamente el desinstalador (Unins000.exe) y la entrada en
  # "Aplicaciones y características" de Windows.

# Portable: un único .exe que el usuario ejecuta directamente, sin instalar.
portable:
  artifactName: ${productName}-${version}-Windows-Portable.${ext}

# ---------- macOS ----------
mac:
  target:
    - dmg         # Imagen de disco para instalar arrastrando a Aplicaciones
  category: public.app-category.business
  artifactName: ${productName}-${version}-Mac.${ext}

dmg:
  title: Gestión Pro Total

# ---------- Linux (incluye contenedor Linux de Chromebook) ----------
linux:
  target:
    - AppImage    # Ejecutable portable, no requiere instalación
    - deb         # Paquete instalable/desinstalable con apt/dpkg
  category: Office
  maintainer: Ramón David García Pérez de Tudela
  artifactName: ${productName}-${version}-Linux.${ext}
